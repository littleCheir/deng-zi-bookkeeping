# 个人记账 Web 应用（V1.1）后端配置
# 说明：
# 1. 数据库账号、密码、连接串等“需要登录/凭据”的配置一律留空，由用户通过环境变量提供，
#    本文件不写入真实凭据，也不提交任何密钥。
# 2. 表结构与初始数据只由 Flyway 迁移文件（src/main/resources/db/migration）管理，
#    项目不使用 JPA，也没有 ddl-auto 自动建表/校验。

spring:
  application:
    name: expense-tracker

  datasource:
    # 例：jdbc:mysql://localhost:3306/expense_tracker?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    baseline-on-migrate: false
    clean-disabled: true

  jackson:
    time-zone: Asia/Shanghai

server:
  # 端口可通过环境变量 SERVER_PORT 修改
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 默认不打印 SQL；排查问题时由用户临时调整日志级别
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml
