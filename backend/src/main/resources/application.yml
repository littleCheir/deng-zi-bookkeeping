# 凳子记账 Web 应用（V1.1）后端配置
# 说明：
# 1. 数据库账号、密码、连接串等凭据不写在本文件：
#    - 本地开发：放在 application-local.yml（已被 .gitignore 的 *-local.yml 忽略），
#      启动时用 SPRING_PROFILES_ACTIVE=local 或 -Dspring-boot.run.profiles=local 激活；
#    - 生产环境：通过 SPRING_DATASOURCE_* 环境变量提供。
# 2. 表结构与初始数据只由 Flyway 迁移文件（src/main/resources/db/migration）管理，
#    项目不使用 JPA，也没有 ddl-auto 自动建表/校验。

spring:
  application:
    name: expense-tracker

  datasource:
    # 例：jdbc:mysql://localhost:3306/expense_tracker?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    baseline-on-migrate: false
    clean-disabled: true

  jackson:
    time-zone: Asia/Shanghai

server:
  # 端口可通过环境变量 SERVER_PORT 修改
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      # 会话有效期 7 天；Cookie 仅由服务端读写（HttpOnly）
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
        # 生产 HTTPS 部署时设为 true（环境变量 SESSION_COOKIE_SECURE=true）
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# 初始所有者账号：仅当该用户名不存在时创建，启动时不重置密码。
# 留空则跳过创建并打印警告；密码只保存 BCrypt 哈希，禁止写入日志。
app:
  initial-owner:
    username: ${APP_INITIAL_OWNER_USERNAME:}
    password: ${APP_INITIAL_OWNER_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 默认不打印 SQL；排查问题时由用户临时调整日志级别
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml
