services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-expense_tracker}"
      MYSQL_USER: "${MYSQL_USER:-expense_tracker}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}"
      TZ: "Asia/Shanghai"
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_0900_ai_ci"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # $$ 在 compose 中转义为容器内的 $，避免在宿主机展开
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-expense_tracker}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: "${MYSQL_USER:-expense_tracker}"
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}"
      APP_INITIAL_OWNER_USERNAME: "${APP_INITIAL_OWNER_USERNAME:?set APP_INITIAL_OWNER_USERNAME in .env}"
      APP_INITIAL_OWNER_PASSWORD: "${APP_INITIAL_OWNER_PASSWORD:?set APP_INITIAL_OWNER_PASSWORD in .env}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      SERVER_PORT: "8080"
      TZ: "Asia/Shanghai"
    depends_on:
      mysql:
        condition: service_healthy
    # 不直接映射到宿主机，只允许 compose 网络内的 web 访问
    expose:
      - "8080"

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  mysql-data:
