server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 前后端同源：/api 反代到 Spring Boot，浏览器看到的是同一个域名
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # 健康检查只暴露 health，不暴露其他 actuator 端点
    location = /actuator/health {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        access_log off;
    }

    # 带 hash 的静态资源可长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发布后立即拿到新入口
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # PWA Manifest：及时更新，并明确 Content-Type
    location = /manifest.webmanifest {
        types {
            application/manifest+json webmanifest;
        }
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Service Worker 脚本必须可及时更新；错误地长缓存会导致旧 SW 长期残留
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Workbox 运行时文件带内容 hash，可长期缓存
    location ~ ^/workbox-.*\.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 应用图标
    location /icons/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        expires 30d;
    }

    # SPA 路由回退：/transactions、/categories 等刷新时不 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
